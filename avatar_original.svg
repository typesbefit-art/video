<svg width="100%" viewBox="0 0 380 380" role="img" xmlns="http://www.w3.org/2000/svg"><title>Анимированная аватарка в стиле манги: парень под дождём</title><desc>Синяя монохромная иллюстрация: парень с опущенной головой и мокрыми волосами, закрывающими глаза; идёт дождь, пряди колышутся, капли стекают по лицу, изредка вспыхивает молния.</desc><defs><clipPath id="c"><circle cx="190" cy="190" r="170"/></clipPath></defs><style>
.hd{animation:hd 5s ease-in-out infinite;transform-origin:190px 340px}
.bg{animation:bg 6s ease-in-out infinite;transform-origin:190px 110px}
.fl{animation:fl 7s infinite}
.r{animation:fall linear infinite}
.r1{animation-duration:.7s}.r2{animation-duration:.9s;animation-delay:-.3s}.r3{animation-duration:1.1s;animation-delay:-.6s}
.dr{animation:dr 3.4s ease-in infinite}
.dr2{animation-delay:1.7s}
.tip{animation:tip 2.6s ease-in infinite;transform-box:fill-box;transform-origin:50% 0%}
@keyframes hd{0%,100%{transform:rotate(-.6deg) translateY(0)}50%{transform:rotate(.8deg) translateY(2px)}}
@keyframes bg{0%,100%{transform:skewX(0deg)}50%{transform:skewX(-1.6deg)}}
@keyframes fl{0%,90%,94%,100%{opacity:0}91%{opacity:.5}92%{opacity:.1}93%{opacity:.35}}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(430px)}}
@keyframes dr{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(70px);opacity:0}}
@keyframes tip{0%,60%{transform:translateY(0) scaleY(1);opacity:1}100%{transform:translateY(40px) scaleY(1.4);opacity:0}}
