<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тут все оттуда</title>
<!--
  «Тут все оттуда» — мультфильм ~45 секунд в одном HTML-файле.
  Всё нарисовано в SVG, анимировано CSS keyframes + requestAnimationFrame (таймлайн).
  Озвучка: Web Speech API (speechSynthesis, ru-RU).

  Параметры адреса (для отладки):
    ?mute=1    — без озвучки (длительность считается по длине фразы)
    ?speed=8   — ускорить таймлайн в N раз (озвучка отключается)
    ?scene=5   — сразу начать с указанной сцены (1..10)
-->
<style>
  :root{ --ink:#1b1530; --ui:#ffd23f; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#0c0a1d; color:#fff;
    font-family:'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif; }
  #app{ min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:12px; }

  /* ---------- Сцена 16:9 ---------- */
  #stage{ position:relative; width:min(96vw, calc((100vh - 96px) * 16 / 9)); aspect-ratio:16/9;
    overflow:hidden; border-radius:18px; border:4px solid var(--ink); background:#000;
    box-shadow:0 12px 40px rgba(0,0,0,.55); container-type:inline-size; }
  .layer{ position:absolute; inset:0; will-change:transform,opacity; }
  .layer svg{ width:100%; height:100%; display:block; }

  /* Переходы между сценами */
  .in-fade  { animation:inFade .9s ease both; }
  .out-fade { animation:outFade .9s ease both; }
  .in-slide { animation:inSlide .9s cubic-bezier(.6,0,.2,1) both; }
  .out-slide{ animation:outSlide .9s cubic-bezier(.6,0,.2,1) both; }
  .in-zoom  { animation:inZoom 1s cubic-bezier(.3,0,.2,1) both; }
  .out-zoom { animation:outFade 1s ease both; }
  @keyframes inFade  { from{opacity:0} to{opacity:1} }
  @keyframes outFade { from{opacity:1} to{opacity:0} }
  @keyframes inSlide { from{transform:translateX(100%)} to{transform:none} }
  @keyframes outSlide{ from{transform:none;opacity:1} to{transform:translateX(-35%);opacity:0} }
  @keyframes inZoom  { from{transform:scale(1.35);opacity:0;filter:brightness(2.2)} to{transform:none;opacity:1;filter:none} }

  /* Белая вспышка «пробуждения» */
  #flash{ position:absolute; inset:0; background:#fff7d6; opacity:0; pointer-events:none; }
  #flash.go{ animation:flash 1.1s ease-out both; }
  @keyframes flash{ 0%{opacity:0} 25%{opacity:1} 100%{opacity:0} }

  /* Субтитры */
  #subs{ position:absolute; left:0; right:0; bottom:3.5%; text-align:center; pointer-events:none; z-index:5; }
  #subText{ display:inline-block; max-width:88%; padding:.3em .85em; border-radius:.55em;
    background:rgba(18,12,36,.78); border:2px solid rgba(255,255,255,.15);
    font-weight:700; line-height:1.25; font-size:clamp(13px,2.4vw,30px); font-size:2.5cqw;
    opacity:0; transform:translateY(12px); transition:opacity .4s, transform .4s; }
  #subText.show{ opacity:1; transform:none; }
  #subText.long{ font-size:clamp(12px,2vw,26px); font-size:2.05cqw; }

  /* Заставка перед стартом */
  #intro{ position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 30%, #2a4b9b 0%, #142456 45%, #0b1230 100%); text-align:center; }
  #intro::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(115deg, transparent 50%, rgba(255,170,60,.55) 50.2%, rgba(255,120,40,.7) 100%); }
  #intro > *{ position:relative; z-index:1; }
  #intro h1{ margin:0; font-size:7.2cqw; letter-spacing:.04em; color:#ffd23f;
    -webkit-text-stroke:.35cqw var(--ink); paint-order:stroke fill; text-shadow:0 .5cqw 0 var(--ink); }
  #intro p{ margin:.6em 0 1.2em; font-size:2cqw; opacity:.9; }
  #intro svg{ width:18cqw; height:18cqw; }
  #intro.hide{ animation:outFade .6s ease both; pointer-events:none; }

  /* Панель управления */
  #controls{ width:min(96vw, calc((100vh - 96px) * 16 / 9)); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  button{ font:inherit; font-weight:800; font-size:16px; padding:9px 16px; border-radius:12px; cursor:pointer;
    border:3px solid var(--ink); background:var(--ui); color:var(--ink); box-shadow:0 4px 0 var(--ink); transition:transform .1s; }
  button:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  button:disabled{ opacity:.45; cursor:default; }
  #btnPause{ background:#7fd3ff; } #btnRestart{ background:#ff8fc8; }
  #bigStart{ font-size:2.4cqw; padding:.5em 1.4em; }
  #progress{ position:relative; flex:1; min-width:120px; height:14px; border-radius:8px; background:#2a2547; border:2px solid #000; overflow:hidden; }
  #bar{ position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg,#3b6cff,#ffd23f,#ff7e5f); }
  .tick{ position:absolute; top:0; bottom:0; width:2px; background:rgba(0,0,0,.55); }
  #counter{ min-width:64px; text-align:right; font-weight:800; opacity:.85; }

  /* ПАУЗА: замораживаем все CSS-анимации внутри сцены */
  #stage.paused *, #stage.paused{ animation-play-state:paused !important; }

  /* ================= Анимации персонажей и предметов ================= */
  .fb{ transform-box:fill-box; transform-origin:center; }          /* вращение/масштаб вокруг центра элемента */
  .breathe{ animation:breathe 2.6s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .blink{ transform-box:fill-box; transform-origin:center; animation:blink 4.2s infinite; }
  @keyframes blink{ 0%,93%,100%{transform:scaleY(1)} 96%{transform:scaleY(.08)} }
  .winkeye{ transform-box:fill-box; transform-origin:center; animation:wink 2.4s infinite; }
  @keyframes wink{ 0%,35%,85%,100%{transform:scaleY(1)} 42%,75%{transform:scaleY(.08)} }
  .wave{ animation:wave .8s ease-in-out infinite; }                  /* вращение руки вокруг плеча (0,0) */
  @keyframes wave{ 0%,100%{transform:rotate(-14deg)} 50%{transform:rotate(16deg)} }
  .shake{ animation:shake .32s linear infinite; }
  @keyframes shake{ 0%,100%{transform:translate(0,0)} 20%{transform:translate(-7px,2px)} 40%{transform:translate(6px,-3px)} 60%{transform:translate(-5px,-2px)} 80%{transform:translate(7px,3px)} }
  .shakeSoft{ animation:shake .6s linear infinite; }
  .zz{ transform-box:fill-box; transform-origin:center; animation:zz 2.7s ease-out infinite both; }
  @keyframes zz{ 0%{transform:translate(0,0) scale(.5);opacity:0} 20%{opacity:1} 100%{transform:translate(70px,-150px) scale(1.25);opacity:0} }
  .pop{ transform-box:fill-box; transform-origin:center; animation:pop .55s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes pop{ 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.12);opacity:1} 100%{transform:scale(1);opacity:1} }
  .dropIn{ animation:dropIn 1.05s ease-out both; }
  @keyframes dropIn{ 0%{transform:translateY(-700px)} 55%{transform:translateY(24px)} 72%{transform:translateY(-12px)} 88%{transform:translateY(5px)} 100%{transform:translateY(0)} }
  .swing{ animation:swing 2.4s ease-in-out infinite alternate; }
  @keyframes swing{ from{transform:rotate(-2.2deg)} to{transform:rotate(2.2deg)} }
  .spin{ animation:spin 40s linear infinite; }
  .spinFast{ animation:spin 12s linear infinite; }
  @keyframes spin{ to{transform:rotate(360deg)} }
  .twinkle{ animation:twinkle 1.6s ease-in-out infinite alternate; }
  @keyframes twinkle{ from{opacity:.25} to{opacity:1} }
  .glow{ animation:glow 1.4s ease-in-out infinite alternate; }
  @keyframes glow{ from{opacity:.55} to{opacity:1} }
  .blinkFast{ animation:blinkFast .7s steps(2) infinite; }
  @keyframes blinkFast{ 50%{opacity:.15} }
  .drift{ animation:drift 9s ease-in-out infinite alternate; }
  @keyframes drift{ to{transform:translateX(90px)} }
  .sway{ animation:sway 3s ease-in-out infinite alternate; }
  @keyframes sway{ from{transform:rotate(-2deg)} to{transform:rotate(2deg)} }
  .vacuum{ animation:vacuum 7s ease-in-out both; }
  @keyframes vacuum{ to{transform:translateX(420px)} }
  .tvFlicker{ animation:tvf .12s steps(2) infinite; }
  @keyframes tvf{ 50%{opacity:.88} }
  .ball{ animation:ball .9s ease-in-out infinite alternate; }
  @keyframes ball{ 0%{transform:translate(-40px,0)} 50%{transform:translate(0,-36px)} 100%{transform:translate(40px,0)} }
  .jump{ animation:jump .7s ease-in-out infinite alternate; }
  @keyframes jump{ to{transform:translateY(-34px)} }
  .scroll{ animation:scroll 2.4s linear infinite; }
  @keyframes scroll{ to{transform:translateX(-80px)} }
  .tamaPet{ animation:tama .5s steps(2) infinite; }
  @keyframes tama{ 50%{transform:translate(4px,-4px)} }
  .beep{ transform-box:fill-box; transform-origin:50% 90%; animation:beep .25s ease-in-out infinite alternate; }
  @keyframes beep{ from{transform:rotate(-8deg)} to{transform:rotate(8deg)} }
  .chew{ transform-box:fill-box; transform-origin:center; animation:chew .32s ease-in-out infinite alternate; }
  @keyframes chew{ to{transform:scaleY(.3) scaleX(1.15)} }
  .gum{ transform-box:fill-box; transform-origin:center; animation:gum 3s ease-in infinite; }
  @keyframes gum{ 0%,18%{transform:scale(0);opacity:1} 76%{transform:scale(1);opacity:1} 80%{transform:scale(1.15);opacity:1} 82%{transform:scale(1.35);opacity:0} 100%{transform:scale(0);opacity:0} }
  .drip{ animation:drip 1.1s ease-in infinite; }
  @keyframes drip{ 0%{transform:translateY(0);opacity:1} 100%{transform:translateY(22px);opacity:0} }
  .faceA{ animation:hideA .12s both; }
  @keyframes hideA{ to{opacity:0} }
  .faceB{ animation:showB .12s both; }
  @keyframes showB{ from{opacity:0} to{opacity:1} }
  .strike{ stroke-dasharray:1; stroke-dashoffset:1; animation:strike .35s ease-out both; }
  @keyframes strike{ to{stroke-dashoffset:0} }
  .stamp{ transform-box:fill-box; transform-origin:center; animation:stamp .5s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes stamp{ 0%{transform:scale(3) rotate(-12deg);opacity:0} 70%{transform:scale(.92) rotate(-12deg);opacity:1} 100%{transform:scale(1) rotate(-12deg);opacity:1} }
  .flyPath{ animation:flyPath 5s ease-in-out infinite; }
  @keyframes flyPath{ 0%,100%{transform:translate(0,0)} 25%{transform:translate(130px,-90px)} 50%{transform:translate(260px,10px)} 75%{transform:translate(120px,80px)} }
  .flap{ transform-box:fill-box; transform-origin:center; animation:flap .22s ease-in-out infinite alternate; }
  @keyframes flap{ to{transform:scaleX(.25)} }
  .flapY{ transform-box:fill-box; transform-origin:center; animation:flapY .35s ease-in-out infinite alternate; }
  @keyframes flapY{ to{transform:scaleY(-.6)} }
  .fly{ animation:fly 8s linear infinite; }
  @keyframes fly{ to{transform:translate(-500px,-60px)} }
  .peck{ transform-box:fill-box; transform-origin:70% 90%; animation:peck .9s ease-in-out infinite; }
  @keyframes peck{ 0%,60%,100%{transform:rotate(0)} 75%{transform:rotate(28deg)} }
  .float{ animation:float 2.2s ease-in-out infinite alternate; }
  @keyframes float{ to{transform:translateY(-14px)} }
  .vibe{ animation:vibe .09s linear infinite alternate; }
  @keyframes vibe{ from{transform:rotate(-1.4deg)} to{transform:rotate(1.4deg)} }
  .flyOut{ transform-box:fill-box; transform-origin:center; animation:flyOut 1.3s ease-out infinite; }
  @keyframes flyOut{ 0%{transform:translate(0,0) scale(.4);opacity:0} 20%{opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0} }
  .cam{ transform-origin:800px 450px; animation:cam 9s ease-out both; }
  @keyframes cam{ from{transform:scale(1)} to{transform:scale(1.06)} }
  .title{ transform-box:fill-box; transform-origin:center; animation:pop .8s cubic-bezier(.2,1.6,.4,1) both, titleFloat 2s 1s ease-in-out infinite alternate; }
  @keyframes titleFloat{ from{transform:scale(1) rotate(-2deg)} to{transform:scale(1.04) rotate(2deg)} }
</style>
</head>
<body>
<!-- Общие градиенты и узоры (на них ссылаются все сцены) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050d26"/><stop offset="1" stop-color="#1c3a7a"/></linearGradient>
    <linearGradient id="gRoomNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18295a"/><stop offset="1" stop-color="#0e1a40"/></linearGradient>
    <linearGradient id="gScreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fe3ff"/><stop offset="1" stop-color="#3a5cff"/></linearGradient>
    <linearGradient id="gMorning" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a0"/><stop offset="1" stop-color="#ffc061"/></linearGradient>
    <linearGradient id="gYard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc56b"/><stop offset="1" stop-color="#fff0c4"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffab5e"/><stop offset="1" stop-color="#ffe3a8"/></linearGradient>
    <linearGradient id="gSunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d2470"/><stop offset=".42" stop-color="#b8407a"/><stop offset=".72" stop-color="#ff8248"/><stop offset="1" stop-color="#ffd36e"/></linearGradient>
    <radialGradient id="rGlow"><stop offset="0" stop-color="#9fe8ff" stop-opacity=".75"/><stop offset="1" stop-color="#9fe8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="rWarm"><stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient>
    <radialGradient id="rSun"><stop offset="0" stop-color="#fff2a8"/><stop offset=".6" stop-color="#ffd36e" stop-opacity=".6"/><stop offset="1" stop-color="#ffd36e" stop-opacity="0"/></radialGradient>
    <pattern id="pDots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="4.5" fill="#fff" opacity=".2"/></pattern>
    <pattern id="pStripes" width="80" height="10" patternUnits="userSpaceOnUse"><rect width="40" height="10" fill="#000" opacity=".05"/></pattern>
    <pattern id="pParquet" width="120" height="40" patternUnits="userSpaceOnUse"><rect width="120" height="40" fill="#c77d3a"/><path d="M0,0 H120 M60,0 V20 M0,20 H120 M30,20 V40 M90,20 V40" stroke="#a9622a" stroke-width="3"/></pattern>
  </defs>
</svg>

<div id="app">
  <div id="stage">
    <div id="layers"></div>
    <div id="flash"></div>
    <div id="subs"><span id="subText"></span></div>
    <div id="intro">
      <svg id="introArt" viewBox="-110 -130 220 220"></svg>
      <h1>ТУТ ВСЕ ОТТУДА</h1>
      <p>мультфильм · ~45 секунд · включите звук 🔊</p>
      <button id="bigStart">▶ Старт</button>
    </div>
  </div>
  <div id="controls">
    <button id="btnStart">▶ Старт</button>
    <button id="btnPause" disabled>⏸ Пауза</button>
    <button id="btnRestart" disabled>↺ Заново</button>
    <div id="progress"><div id="bar"></div></div>
    <span id="counter">0 / 10</span>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   0. Утилиты
   ===================================================================== */
const INK = '#1b1530';            // цвет толстых контуров
const SKIN = '#ffd2a6';
let _uid = 0;
const uid = (p = 'u') => `${p}${++_uid}`;           // уникальные id для clipPath
// Детерминированный генератор случайных чисел (чтобы кадры были одинаковыми)
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// Отразить путь по X (для симметричных бровей)
const mirror = d => d.replace(/(-?\d+\.?\d*),(-?\d+\.?\d*)/g, (m, x, y) => `${-x},${y}`);
// Текст без обводки (или с обводкой при o.outline)
function T(x, y, str, size, fill = INK, o = {}) {
  const stroke = o.outline ? `stroke="${o.stroke || INK}" stroke-width="${o.outline}" paint-order="stroke"` : 'stroke="none"';
  return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${o.anchor || 'middle'}" font-weight="${o.weight || 900}" ${stroke} ${o.cls ? `class="${o.cls}"` : ''} ${o.style ? `style="${o.style}"` : ''}>${str}</text>`;
}
const at = (x, y, inner, s = 1, r = 0) => `<g transform="translate(${x},${y}) rotate(${r}) scale(${s})">${inner}</g>`;
const delay = d => `style="animation-delay:${d}s"`;

/* =====================================================================
   1. ПЕРСОНАЖИ: универсальный Character + пресет Dima
      Локальная система: (0,0) — точка между ступнями, рост ≈ 420.
   ===================================================================== */

// Позы рук: e — локоть, h — кисть (относительно плеча, для правой руки; левая зеркалится)
const ARM = {
  down:  { e: [14, 55],  h: [12, 112] },
  wave:  { e: [48, -30], h: [58, -108] },
  up:    { e: [58, -48], h: [72, -128] },
  hold:  { e: [22, 62],  h: [-22, 80] },
  phone: { e: [26, 58],  h: [-18, 30] },
  mouth: { e: [18, 48],  h: [-48, -52] },
  shh:   { e: [24, 44],  h: [-46, -36] },
  hips:  { e: [44, 40],  h: [8, 92] },
  game:  { e: [22, 64],  h: [-26, 78] },
  point: { e: [55, 5],   h: [115, -15] },
};

function arm(side, pose, sleeve, skin, item, waveDelay) {
  const p = ARM[pose] || ARM.down;
  const ex = p.e[0] * side, ey = p.e[1], hx = p.h[0] * side, hy = p.h[1];
  const d = `M0,0 L${ex},${ey} L${hx},${hy}`;
  let hand = `<circle cx="${hx}" cy="${hy}" r="15" fill="${skin}"/>`;
  if (pose === 'shh') hand += `<rect x="${hx - 5}" y="${hy - 40}" width="11" height="34" rx="5.5" fill="${skin}" stroke-width="4"/>`;
  const it = item ? `<g transform="translate(${hx},${hy})">${item}</g>` : '';
  const anim = pose === 'wave' ? `class="wave" ${delay(waveDelay || 0)}` : '';
  // Рука = толстая тёмная линия (контур) + линия цвета рукава поверх
  return `<g transform="translate(${side * 52},-245)"><g ${anim}>
    <path d="${d}" fill="none" stroke-width="34"/><path d="${d}" fill="none" stroke="${sleeve}" stroke-width="22"/>
    ${it}${hand}</g></g>`;
}

function legsStand(o) {
  const dress = o.top === 'dress';
  const c = dress ? o.skin : o.pants, w = dress ? 20 : 32;
  return `<rect x="${-6 - w}" y="-118" width="${w}" height="108" rx="8" fill="${c}"/>
    <rect x="6" y="-118" width="${w}" height="108" rx="8" fill="${c}"/>
    <path d="M-50,-2 Q-50,-24 -22,-24 Q-4,-24 -4,-2Z" fill="${o.shoes}"/>
    <path d="M50,-2 Q50,-24 22,-24 Q4,-24 4,-2Z" fill="${o.shoes}"/>`;
}
function legsSit(o) {
  const c = o.pants;
  return `<rect x="-40" y="-50" width="30" height="42" rx="8" fill="${c}"/><rect x="10" y="-50" width="30" height="42" rx="8" fill="${c}"/>
    <rect x="-48" y="-76" width="44" height="36" rx="15" fill="${c}"/><rect x="4" y="-76" width="44" height="36" rx="15" fill="${c}"/>
    <path d="M-50,-2 Q-50,-24 -22,-24 Q-4,-24 -4,-2Z" fill="${o.shoes}"/>
    <path d="M50,-2 Q50,-24 22,-24 Q4,-24 4,-2Z" fill="${o.shoes}"/>`;
}

// Варианты одежды (торс)
const TORSO = {
  hoodie: o => `<path d="M-52,-258 C-68,-200 -66,-150 -58,-105 L58,-105 C66,-150 68,-200 52,-258 Q0,-274 -52,-258Z" fill="${o.topColor}"/>
    <rect x="-58" y="-122" width="116" height="18" rx="6" fill="${o.topColor2}"/>
    <path d="M-34,-168 L34,-168 L42,-126 L-42,-126Z" fill="${o.topColor2}" stroke-width="5"/>
    <path d="M-44,-262 Q0,-220 44,-262 Q34,-290 0,-290 Q-34,-290 -44,-262Z" fill="${o.topColor2}"/>
    <path d="M-12,-246 L-15,-200 M12,-246 L15,-200" stroke="#fff" stroke-width="5" fill="none"/>
    <circle cx="-15" cy="-198" r="5" fill="#fff" stroke-width="3"/><circle cx="15" cy="-198" r="5" fill="#fff" stroke-width="3"/>`,
  tshirt: o => {
    const shape = 'M-50,-258 C-62,-200 -60,-150 -56,-105 L56,-105 C60,-150 62,-200 50,-258 Q0,-270 -50,-258Z';
    let s = `<path d="${shape}" fill="${o.topColor}"/>`;
    if (o.stripes) {
      for (let y = -240; y < -110; y += 32) s += `<rect x="-57" y="${y}" width="114" height="13" fill="${o.topColor2}" stroke="none"/>`;
      s += `<path d="${shape}" fill="none"/>`;
    } else s += `<circle cx="0" cy="-185" r="20" fill="${o.topColor2}" stroke-width="4"/><path d="M-8,-185 L8,-185 M0,-193 L0,-177" stroke="#fff" stroke-width="4"/>`;
    return s + `<path d="M-20,-262 Q0,-238 20,-262" fill="none" stroke-width="5"/>`;
  },

/* ---- Лицо и эмоции: [глаза, брови, рот, доп.] ---- */
const EMO = {

  happy:   ['happy', 'up', 'openSmile', 'blush'],

  shock:   ['big', 'up', 'O'],
  panic:   ['big', 'worried', 'wavy', 'sweat'],
  nervous: ['open', 'worried', 'grin', 'sweat'],
  chew:    ['half', 'relaxed', 'chew'],

function Eye(x, type, cls) {
  switch (type) {
    case 'big': return `<g class="blink"><ellipse cx="${x}" cy="-6" rx="17" ry="23" fill="#fff" stroke-width="4"/><circle cx="${x}" cy="-4" r="5" fill="${INK}" stroke="none"/></g>`;
    case 'closed': return `<path d="M${x - 12},-4 Q${x},6 ${x + 12},-4" fill="none" stroke-width="5"/>`;
    case 'happy': return `<path d="M${x - 12},-2 Q${x},-16 ${x + 12},-2" fill="none" stroke-width="5"/>`;
    case 'half': return `<ellipse cx="${x}" cy="-6" rx="13" ry="17" fill="#fff" stroke-width="4"/><circle cx="${x + 3}" cy="-1" r="7" fill="${INK}" stroke="none"/>
      <path d="M${x - 15},-6 L${x + 15},-6 L${x + 15},-26 L${x - 15},-26Z" style="fill:var(--skin)" stroke="none"/><path d="M${x - 14},-6 L${x + 14},-6" stroke-width="5"/>`;
    default: return `<g class="${cls || 'blink'}"><ellipse cx="${x}" cy="-6" rx="13" ry="17" fill="#fff" stroke-width="4"/>
      <circle cx="${x + 2}" cy="-3" r="7" fill="${INK}" stroke="none"/><circle cx="${x + 4.5}" cy="-6.5" r="2.4" fill="#fff" stroke="none"/></g>`;
  }
}
function Brows(t, color, dy = 0) {
  const P = { flat: 'M-40,-36 L-12,-36', up: 'M-42,-48 Q-26,-60 -10,-48', worried: 'M-40,-34 L-12,-47',
              relaxed: 'M-40,-32 Q-26,-36 -12,-32', sly: 'M-42,-46 Q-26,-58 -10,-46' };
  const L = P[t] || P.flat, R = mirror(P[t === 'sly' ? 'flat' : t] || P.flat);
  return `<g transform="translate(0,${dy})" fill="none" stroke="${color}" stroke-width="9"><path d="${L}"/><path d="${R}"/></g>`;
}
function Mouth(t) {
  switch (t) {
    case 'smile': return `<path d="M-24,24 Q0,50 24,24" fill="none" stroke-width="5"/>`;
    case 'openSmile': return `<path d="M-28,20 Q0,66 28,20 Z" fill="#7a1f2b" stroke-width="5"/><path d="M-14,44 Q0,36 14,44 Q0,56 -14,44Z" fill="#ff7a8a" stroke="none"/>`;
    case 'grin': return `<rect x="-24" y="20" width="48" height="20" rx="9" fill="#fff" stroke-width="5"/><path d="M-24,30 L24,30 M-8,20 L-8,40 M8,20 L8,40" stroke-width="3"/>`;
    case 'o': return `<ellipse cx="0" cy="34" rx="7" ry="8" fill="#7a1f2b" stroke-width="4"/>`;
    case 'O': return `<ellipse cx="0" cy="36" rx="14" ry="20" fill="#7a1f2b" stroke-width="5"/>`;
    case 'wavy': return `<path d="M-24,34 q6,-9 12,0 t12,0 t12,0 t12,0" fill="none" stroke-width="5"/>`;
    case 'frown': return `<path d="M-16,38 Q0,24 16,38" fill="none" stroke-width="5"/>`;
    case 'chew': return `<ellipse class="chew" cx="4" cy="32" rx="12" ry="7" fill="#7a1f2b" stroke-width="4"/>
      <g class="gum"><circle cx="8" cy="36" r="34" fill="#ff8fc8" fill-opacity=".93" stroke-width="5"/><ellipse cx="-6" cy="22" rx="8" ry="5" fill="#fff" opacity=".8" stroke="none"/></g>`;
    default: return `<path d="M-14,30 Q0,37 14,30" fill="none" stroke-width="5"/>`;
  }
}
// part: 'main' — глаза/нос/рот, 'brows' — брови (рисуются поверх причёски)
function Face(em, o, part) {
  const [ey, br, mo, ex] = EMO[em] || EMO.neutral;
  if (part === 'brows') return Brows(br, o.browColor || o.hair, o.browDy || 0);
  let s = ey === 'wink' ? Eye(-25, 'open') + Eye(25, 'open', 'winkeye') : Eye(-25, ey) + Eye(25, ey);
  s += `<path d="M-3,6 Q7,14 -2,20" fill="none" stroke-width="4"/>` + Mouth(mo);
  if (ex === 'blush') s += `<ellipse cx="-42" cy="18" rx="12" ry="7" fill="#ff7a8a" opacity=".55" stroke="none"/><ellipse cx="42" cy="18" rx="12" ry="7" fill="#ff7a8a" opacity=".55" stroke="none"/>`;
  if (ex === 'sweat') s += `<g class="drip"><path d="M64,-44 Q76,-24 64,-16 Q52,-24 64,-44Z" fill="#8fd8ff" stroke-width="4"/></g>`;
  return s;
}

const HAIR = {

function Head(o) {
  const swap = !!o.emotion2;
  const part = p => swap
    ? `<g class="faceA" ${delay(o.swapAt)}>${Face(o.emotion, o, p)}</g><g class="faceB" ${delay(o.swapAt)}>${Face(o.emotion2, o, p)}</g>`
    : Face(o.emotion, o, p);
  let s = (HAIR_BACK[o.hairStyle] ? HAIR_BACK[o.hairStyle](o) : '');
  s += `<circle cx="-66" cy="4" r="15" fill="${o.skin}"/><circle cx="66" cy="4" r="15" fill="${o.skin}"/>`;

/** Речевой пузырь. Хвостик направлен к точке (tx,ty). */
function Bubble(x, y, w, h, lines, o = {}) {
  const { tx = x + w / 2, ty = y + h + 60, d = 0, size = 44, fill = '#fff', color = INK } = o;
  let b1, b2, tip = [tx, ty], inner;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  if (ty > y + h) { const bx = clamp(tx, x + 50, x + w - 50); b1 = [bx - 24, y + h - 4]; b2 = [bx + 24, y + h - 4]; }
  else if (tx > x + w) { const by = clamp(ty, y + 40, y + h - 40); b1 = [x + w - 4, by - 22]; b2 = [x + w - 4, by + 22]; }
  else if (tx < x) { const by = clamp(ty, y + 40, y + h - 40); b1 = [x + 4, by - 22]; b2 = [x + 4, by + 22]; }
  else { const bx = clamp(tx, x + 50, x + w - 50); b1 = [bx - 24, y + 4]; b2 = [bx + 24, y + 4]; }
  inner = [(b1[0] + b2[0]) / 2 * .3 + tip[0] * .7, (b1[1] + b2[1]) / 2 * .3 + tip[1] * .7];
  const n = lines.length, lh = size * 1.2, y0 = y + h / 2 - (n - 1) * lh / 2 + size * .36;
  const txt = lines.map((l, i) => T(x + w / 2, y0 + i * lh, l, size, color)).join('');
  return `<g class="pop" ${delay(d)}>
    <polygon points="${b1} ${b2} ${tip}" fill="${fill}"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(40, h / 2)}" fill="${fill}" stroke-width="7"/>
    <polygon points="${b1[0] + (b1[0] < b2[0] ? 6 : 0)},${b1[1] + (b1[1] < b2[1] ? 6 : 0)} ${b2[0] - (b1[0] < b2[0] ? 6 : 0)},${b2[1] - (b1[1] < b2[1] ? 6 : 0)} ${inner}" fill="${fill}" stroke="none"/>
    ${txt}</g>`;
}

/** Панельная многоэтажка */
function Building(o) {
  const { x, y, w, h, cols, rows, color = '#e8d3ad', seam = '#c9ae84', win = '#8fc3e8', lit = 0, seed = 1, balcony = true } = o;
  const r = rng(seed), cw = w / cols, rh = h / rows;
  let s = `<rect x="${x - 12}" y="${y - 16}" width="${w + 24}" height="22" fill="${seam}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}"/>`;
  for (let i = 1; i < cols; i++) s += `<path d="M${x + i * cw},${y} V${y + h}" stroke="${seam}" stroke-width="3"/>`;
  for (let j = 1; j < rows; j++) s += `<path d="M${x},${y + j * rh} H${x + w}" stroke="${seam}" stroke-width="3"/>`;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const wx = x + i * cw + cw * .25, wy = y + j * rh + rh * .2, ww = cw * .5, wh = rh * .5;
    const isLit = r() < lit;
    s += `<rect x="${wx}" y="${wy}" width="${ww}" height="${wh}" fill="${isLit ? '#ffd66b' : win}" stroke-width="4" ${isLit && r() < .3 ? 'class="twinkle"' : ''}/>`;
    s += `<path d="M${wx + ww / 2},${wy} V${wy + wh}" stroke-width="3"/>`;
    if (!isLit && r() < .25) s += `<rect x="${wx + 3}" y="${wy + 3}" width="${ww * .3}" height="${wh - 6}" fill="#ff9f43" stroke="none"/>`;
    if (balcony && i % 3 === 1 && j > 0 && j < rows) s += `<rect x="${wx - 10}" y="${wy + wh * .6}" width="${ww + 20}" height="${rh * .32}" fill="${seam}" stroke-width="4"/>`;
  }
  return s;
}

/* =====================================================================
   4. ОЗВУЧКА (Web Speech API)
   ===================================================================== */
const params = new URLSearchParams(location.search);
const SPEED = Math.max(.1, parseFloat(params.get('speed')) || 1);
const MUTE = params.has('mute') || SPEED !== 1;
const Speech = {
  ok: ('speechSynthesis' in window) && !MUTE,
  voice: null,
  init() {
    if (!this.ok) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      this.voice = vs.find(v => /^ru/i.test(v.lang) && /google|milena|yandex|irina/i.test(v.name)) || vs.find(v => /^ru/i.test(v.lang)) || null;
    };
    pick();
    speechSynthesis.addEventListener('voiceschanged', pick);
  },
};
Speech.init();
// Примерная длительность фразы (запасной вариант, если onend не придёт)
const estimateMs = (text, rate = 1) => (700 + text.length * 70) / rate;

/* =====================================================================
   5. ТАЙМЛАЙН (requestAnimationFrame) + переходы + управление
   ===================================================================== */
const $ = id => document.getElementById(id);
const layers = $('layers'), stage = $('stage'), sub = $('subText');
const VOICE_DELAY = 350;  // мс от начала сцены до начала фразы
const TAIL = 600;         // пауза после конца фразы перед следующей сценой
const M = {               // состояние плеера
  idx: -1, running: false, paused: false, finished: false,
  t: 0, spoken: false, speechDone: false, speechEndT: 0, hardCap: 0, token: 0,
  elapsedDone: 0, log: [],
};
window.__movie = { M, scenes, jump: i => { restart(i); } };

function wrapSVG(inner) {
  return `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <g class="cam" stroke="${INK}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"
       font-family="'Trebuchet MS','Segoe UI',Verdana,'DejaVu Sans',sans-serif">${inner}</g></svg>`;
}

/** Показывает сцену i с переходом */
function startScene(i) {
  const sc = scenes[i];
  M.idx = i; M.t = 0; M.spoken = false; M.speechDone = false; M.speechEndT = 0; M.hardCap = 0;
  M.token++;
  const tr = sc.transition || 'fade';
  const kind = tr === 'flash' ? 'fade' : tr;
  // старые слои уезжают/гаснут и удаляются по окончании своей анимации
  [...layers.children].forEach(old => {
    if (old.dataset.leaving) return;
    old.dataset.leaving = '1';
    old.className = `layer out-${kind}`;
    old.addEventListener('animationend', e => { if (e.target === old) old.remove(); });
  });
  const el = document.createElement('div');
  el.className = `layer in-${kind}`;
  el.innerHTML = wrapSVG(sc.draw());
  layers.appendChild(el);
  if (tr === 'flash') { const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
  // субтитры
  sub.classList.remove('show'); sub.textContent = sc.subtitle; sub.classList.toggle('long', sc.subtitle.length > 48); void sub.offsetWidth; sub.classList.add('show');
  $('counter').textContent = `${i + 1} / ${scenes.length}`;
  M.log.push({ scene: i + 1, at: Math.round(performance.now()) });
}

/** Произносит фразу сцены; длительность сцены подстроится под onend */
function speakScene(sc) {
  const est = sc.voiceMs || estimateMs(sc.voice, sc.rate || 1);   // voiceMs — точная длина фразы, если известна
  if (!Speech.ok) { M.speechDone = true; M.speechEndT = M.t + est; return; }
  const my = M.token, t0 = M.t;
  try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  const u = new SpeechSynthesisUtterance(sc.voice);
  u.lang = 'ru-RU';
  if (Speech.voice) u.voice = Speech.voice;
  u.rate = sc.rate || 1; u.pitch = sc.pitch || 1;
  u.onend = () => { if (my !== M.token) return; M.speechDone = true; M.speechEndT = M.t; };
  u.onerror = () => { if (my !== M.token) return; M.speechDone = true; M.speechEndT = Math.max(M.t, t0 + est); };
  M.hardCap = t0 + est * 1.8 + 2500;     // страховка, если onend так и не придёт
  window.__utt = u;                       // держим ссылку (иначе Chrome может «потерять» onend)
  speechSynthesis.speak(u);
}

function finish() {
  M.running = false; M.finished = true;
  $('btnStart').textContent = '▶ Ещё раз'; $('btnStart').disabled = false;
  $('btnPause').disabled = true;
  M.log.push({ finished: true, at: Math.round(performance.now()) });
}

let last = 0;
function tick(now) {
  const dt = last ? Math.min(100, now - last) : 0; last = now;
  if (M.running && !M.paused) {
    M.t += dt * SPEED;
    const sc = scenes[M.idx];
    if (!M.spoken && M.t >= VOICE_DELAY) { M.spoken = true; speakScene(sc); }
    const minD = sc.duration * 1000;
    const end = M.speechDone ? Math.max(minD, M.speechEndT + TAIL) : Math.max(minD, M.hardCap || Infinity);
    if (M.spoken && M.t >= end) {
      M.elapsedDone += M.t;
      if (M.idx + 1 < scenes.length) startScene(M.idx + 1); else finish();
    }
  }
  // прогресс-бар
  const total = scenes.reduce((a, s) => a + s.duration * 1000, 0);
  const cur = M.finished ? total : Math.min(total, M.elapsedDone + (M.running ? M.t : 0));
  $('bar').style.width = `${(cur / total * 100).toFixed(2)}%`;
  requestAnimationFrame(tick);
}

function restart(from = 0) {
  try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  layers.innerHTML = '';
  $('intro').classList.add('hide');
  M.running = true; M.paused = false; M.finished = false; M.elapsedDone = 0;
  stage.classList.remove('paused');
  scenes.slice(0, from).forEach(s => { M.elapsedDone += s.duration * 1000; });
  $('btnStart').textContent = '▶ Старт'; $('btnStart').disabled = true;
  $('btnPause').disabled = false; $('btnPause').textContent = '⏸ Пауза';
  $('btnRestart').disabled = false;
  startScene(Math.max(0, Math.min(scenes.length - 1, from)));
}
function togglePause() {
  if (!M.running) return;
  M.paused = !M.paused;
  stage.classList.toggle('paused', M.paused);
  $('btnPause').textContent = M.paused ? '▶ Продолжить' : '⏸ Пауза';
  if (Speech.ok) { try { M.paused ? speechSynthesis.pause() : speechSynthesis.resume(); } catch (e) { /* ignore */ } }
}

// Кнопки
$('btnStart').onclick = $('bigStart').onclick = () => { if (!M.running) restart(0); };
$('btnPause').onclick = togglePause;
$('btnRestart').onclick = () => restart(0);
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); M.running ? togglePause() : restart(0); } });

// Метки сцен на прогресс-баре
(() => {
  const total = scenes.reduce((a, s) => a + s.duration, 0); let acc = 0;
  scenes.slice(0, -1).forEach(s => { acc += s.duration; const t = document.createElement('div'); t.className = 'tick'; t.style.left = `${acc / total * 100}%`; $('progress').appendChild(t); });
})();
// Портрет Димы на заставке (тот же компонент Head)
$('introArt').innerHTML = `<g stroke="${INK}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">${Head(Object.assign({}, CHAR_DEFAULTS, { emotion: 'wink' }))}</g>`;

requestAnimationFrame(tick);
if (params.get('scene')) restart(parseInt(params.get('scene'), 10) - 1);
</script>
