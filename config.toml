# ─────────────────────────────────────────────────────────────────────
#  Настройки генератора страшных историй. Код (generate.py) не трогаем.
#  Цвета — "#RRGGBB". Времена — в секундах.
# ─────────────────────────────────────────────────────────────────────

[video]
width = 1080
height = 1920
fps = 30                 # можно переопределить флагом --fps 60
crf = 19                 # качество H.264 (меньше = лучше и тяжелее)
min_duration = 50        # если ролик выходит короче/длиннее — паузы и темп
max_duration = 65        # голоса подстраиваются автоматически
title_duration = 1.5     # сколько висит заголовок в начале
outro_gap = 0.7          # темнота между последним словом и плашкой
outro_duration = 1.5     # длительность финальной плашки
outro_text = "Часть 2?"
timecode_start = "03:00:07"   # таймкод в правом верхнем углу
cam_label = "CAM 01  ·  IR"   # подпись слева снизу
outro_subtext = "Подписывайся"

[voice]
narrator = "ru-RU-DmitryNeural"
narrator_rate = "-8%"
narrator_pitch = "-3Hz"
# Реплики в «ёлочках» озвучиваются вторым голосом
quote_voice = "ru-RU-SvetlanaNeural"
quote_rate = "-10%"
quote_pitch = "-2Hz"
quote_whisper = 0.65      # 0 — обычный голос, 1 — почти чистый шёпот
quote_level_db = -5       # громкость реплики относительно рассказчика
pause = 0.6               # пауза между предложениями
pause_before_quote = 1.3  # пауза перед репликой в «ёлочках»
pause_before_last = 1.5   # пауза перед последним предложением
pause_short = 0.25        # «Реплика, — сказала она» — короткая пауза у слов автора
# Кавычки, которые читает рассказчик, а не второй голос (надписи, имена, свои реплики)
narrator_quotes = []
# Особые паузы перед ключевыми фразами:
# pause_before = [{ phrase = "Мы не знаем ни одной Лены", pause = 1.3 }]

[subtitles]
fonts = [
  "/usr/share/fonts/opentype/inter/Inter-ExtraBold.otf",
  "/usr/share/fonts/truetype/inter/Inter-ExtraBold.ttf",
  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
  "Inter-ExtraBold.otf", "DejaVuSans-Bold.ttf", "Arial Bold.ttf",
]
size = 90
stroke = 9
y = 0.62                  # центр субтитров, доля высоты кадра
words_max = 4             # по 3–4 слова на экране
uppercase = false
pulse = 0.10              # сила пульсации текущего слова

[colors]
subtitle = "#FFFFFF"
subtitle_active = "#E3242B"
subtitle_quote = "#CFE6D2"     # слова реплики второго голоса
stroke = "#000000"
title = "#EEF3EC"
night_tint = "#B4DCB8"         # оттенок «ночной камеры» (и для фоновых видео)
day_tint = "#EEEAE4"           # дневной режим камеры (без зелёного)
hud = "#D2E6D2"
rec = "#FF2B2B"
outro_box = "#0C0C0C"
outro_accent = "#E3242B"
outro_text = "#FFFFFF"

[background]
folder = "bg"
brightness = 0.65          # 0.65 = приглушить на 35%
grain = 16                 # зерно для фонового видео
generated_grain = 22       # зерно для сгенерированного фона
vignette = 0.6
hud_on_video = false       # рамка REC поверх твоих видео

[audio]
sample_rate = 48000
noise_db = -34             # шум эфира видеоняни
crackle_every = [2.5, 7.0] # редкий треск помех: интервал, сек
voice_peak_db = -1.5
music_below_voice_db = 16  # музыка тише голоса (требование: минимум 12)
sfx_below_voice_db = 12    # удар, помехи, щелчки — тоже тише голоса минимум на 12 dB

# ── События по ключевым словам ──────────────────────────────────────
# Фразы ищутся в тексте озвучки без учёта регистра; слово можно указывать
# основой: "колыбельн" найдёт «колыбельная». Если фраза не найдена —
# событие просто пропускается (история может быть любой).

[[events]]
type = "music_box"        # шкатулка: от start до stop, потом обрывается
start = "колыбельн"
stop = "включил свет"

[[events]]
type = "flash"            # мерцание + белый силуэт в центре
word = "женщин"
duration = 0.3
occurrence = "all"        # "all" или номер вхождения (1, 2, ...)

[[events]]
type = "ghost"            # смутная фигура у кроватки на сгенерированном фоне
show = "женщин"
hide = "включил свет"

[[events]]
type = "ghost"
show = "по-прежнему стояла"

[[events]]
type = "light"            # засветка камеры и щелчок выключателя
phrase = "включил свет"   # срабатывает на последнем слове фразы

[[events]]
type = "zoom"
phrase = "лицом к камере"
amount = 0.08

[[events]]
type = "silence"          # резкая тишина после фразы
phrase = "поднесла палец к губам"
duration = 1.5

[[events]]
type = "hit"              # низкий удар
word = "улыбнулась"

[[events]]
type = "ending"           # помехи и затемнение с этой фразы до конца
phrase = "перевела взгляд"
